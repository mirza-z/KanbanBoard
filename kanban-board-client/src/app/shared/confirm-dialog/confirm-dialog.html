<div class="modal-card">
  <div class="modal-header">
    <h2>{{ data.title }}</h2>
    <button type="button" (click)="cancel()">✕</button>
  </div>

  <p>{{ data.message }}</p>

  <div class="modal-actions">
    <button type="button" class="btn-secondary" (click)="cancel()">{{ data.cancelLabel ?? 'Cancel' }}</button>
    <button type="button" class="btn-danger" (click)="confirm()">{{ data.confirmLabel ?? 'Delete' }}</button>
  </div>
</div>
